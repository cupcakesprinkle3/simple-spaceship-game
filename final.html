<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Spaceship Battle</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    #scoreBoard {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-size: 20px;
      z-index: 1;
    }
    #controls {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-size: 16px;
      color: #ffffff;
      z-index: 1;
      background: rgba(0, 255, 204, 0.1);
      padding: 10px 20px;
      border: 1px solid #00ffcc;
      border-radius: 8px;
    }
    #winner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      color: #ffff00;
      background: rgba(0, 0, 0, 0.9);
      padding: 20px;
      border: 3px solid #ffff00;
      border-radius: 10px;
      display: none;
      white-space: pre;
      z-index: 2;
      text-align: center;
    }
    #playAgainBtn {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      background: #00ffcc;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: black;
    }
  </style>
</head>
<body>
  <div id="scoreBoard">Player 1: 0 | Player 2: 0</div>
  <div id="controls">
    <strong>Player 1 (Green)</strong>: Move = W/A/S/D, Shoot = Spacebar<br>
    <strong>Player 2 (Pink)</strong>: Move = Arrow Keys, Shoot = Enter
  </div>
  <div id="winner"></div>
  <audio id="hitSound" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg" preload="auto"></audio>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const keys = {};
    let score1 = 0;
    let score2 = 0;
    let gameOver = false;

    const hitSound = document.getElementById('hitSound');
    const winnerText = document.getElementById('winner');

    const stars = Array.from({ length: 100 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 1.5 + 0.5,
      speed: Math.random() * 0.5 + 0.2
    }));

    class Spaceship {
      constructor(x, y, color, leftKey, rightKey, upKey, downKey, shootKey) {
        this.x = x;
        this.y = y;
        this.width = 40;
        this.height = 20;
        this.color = color;
        this.speed = 5;
        this.leftKey = leftKey;
        this.rightKey = rightKey;
        this.upKey = upKey;
        this.downKey = downKey;
        this.shootKey = shootKey;
        this.cooldown = 0;
      }
      draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
      }
      move() {
        if (gameOver) return;
        if (keys[this.leftKey]) this.x -= this.speed;
        if (keys[this.rightKey]) this.x += this.speed;
        if (keys[this.upKey]) this.y -= this.speed;
        if (keys[this.downKey]) this.y += this.speed;
        this.x = Math.max(0, Math.min(canvas.width - this.width, this.x));
        this.y = Math.max(0, Math.min(canvas.height - this.height, this.y));
      }
      shoot(bullets) {
        if (gameOver) return;
        if (this.cooldown <= 0 && keys[this.shootKey]) {
          const bulletSpeed = this === player1 ? -7 : 7;
          bullets.push(new Bullet(this.x + this.width / 2, this.y + this.height / 2, this.color, this, bulletSpeed));
          this.cooldown = 20;
        }
        if (this.cooldown > 0) this.cooldown--;
      }
    }

    class Bullet {
      constructor(x, y, color, owner, speed) {
        this.x = x;
        this.y = y;
        this.radius = 4;
        this.color = color;
        this.speed = speed;
        this.owner = owner;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
      update() {
        this.y += this.speed;
      }
    }

    const player1 = new Spaceship(100, canvas.height - 60, '#00ffcc', 'a', 'd', 'w', 's', ' ');
    const player2 = new Spaceship(canvas.width - 140, 40, '#ff00cc', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Enter');
    const bullets = [];

    function updateScore() {
      document.getElementById('scoreBoard').innerText = `Player 1: ${score1} | Player 2: ${score2}`;
    }

    function declareWinner(winner) {
      const trophy = `
      .-=========-.
      \\'-=======-'/
      _|   .=.   |_
     ((|  ${winner === 'Player 1' ? 'P1' : 'P2'}  |))
      \|   /|\   |/
       \__ '.' __\/
         _\) (/_ 
       _/_______\_
      /___________\\
      `;
      winnerText.innerHTML = `
    ${winner} Wins!<br>
    Final Score: Player 1: ${score1} | Player 2: ${score2}<br>
    <pre>${trophy}</pre>
    <button id='playAgainBtn' onclick='window.location.reload()'>Play Again</button>
    `;
      winnerText.style.display = 'block';
      gameOver = true;
    }

    function drawBackground() {
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'white';
      stars.forEach(star => {
        star.y += star.speed;
        if (star.y > canvas.height) {
          star.y = 0;
          star.x = Math.random() * canvas.width;
        }
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function gameLoop() {
      if (gameOver) return;

      drawBackground();
      player1.move();
      player2.move();
      player1.shoot(bullets);
      player2.shoot(bullets);
      player1.draw();
      player2.draw();

      bullets.forEach((bullet, index) => {
        bullet.update();
        bullet.draw();

        if (bullet.y < 0 || bullet.y > canvas.height) {
          bullets.splice(index, 1);
        } else if (
          bullet.owner !== player1 &&
          bullet.x > player1.x && bullet.x < player1.x + player1.width &&
          bullet.y > player1.y && bullet.y < player1.y + player1.height
        ) {
          score2++;
          updateScore();
          hitSound.currentTime = 0;
          hitSound.play();
          bullets.splice(index, 1);
          if (score2 >= 2) declareWinner('Player 2');
        } else if (
          bullet.owner !== player2 &&
          bullet.x > player2.x && bullet.x < player2.x + player2.width &&
          bullet.y > player2.y && bullet.y < player2.y + player2.height
        ) {
          score1++;
          updateScore();
          hitSound.currentTime = 0;
          hitSound.play();
          bullets.splice(index, 1);
          if (score1 >= 2) declareWinner('Player 1');
        }
      });

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (e) => keys[e.key] = true);
    window.addEventListener('keyup', (e) => keys[e.key] = false);

    updateScore();
    gameLoop();
  </script>
</body>
</html>
